<div id="mummu-container" style="all:initial;display:block;width:100% !important;min-width:100% !important;margin:0;padding:0;overflow:hidden;box-sizing:border-box;">&nbsp; <iframe id="portfolio-iframe" src="https://mummuuyo.github.io/artmug_site_new/artmug-chibi" style="display: block; width: 1px; border-width: medium; border-style: none; border-color: currentcolor; border-image: none; overflow: hidden; margin: 0px; padding: 0px; height: 3200px; min-width: 100% !important;" scrolling="no"></iframe></div>
<script>
window.addEventListener('message', function(e) {
    var f = document.getElementById('portfolio-iframe');
    if (!f) return;
    if (e.data && e.data.height) {
        f.style.height = e.data.height + 'px';
    }
    if (e.data && e.data.type === 'jump') {
        var r = f.getBoundingClientRect();
        var t = r.top + window.pageYOffset;
        var s = t + e.data.targetTop - 70;
        window.scrollTo({top: s, behavior: 'smooth'});
    }
    if (e.data && e.data.type === 'open_qna') {
        try {
            if (typeof pLightBox !== 'undefined') {
                pLightBox.show('php/qna_write.php?cate=110000000000&number=60682','iframe_w','1080','500','문의하기','0');
                if (typeof qnaAlert === 'function') {
                    qnaAlert();
                }
                setTimeout(function() {
                    var lightBoxIframe = document.querySelector('iframe.iframe_w, iframe[src*="qna_write"]');
                    if (lightBoxIframe) {
                        try {
                            var ibody = lightBoxIframe.contentDocument || lightBoxIframe.contentWindow.document;
                            var editorDoc = ibody.querySelector('.note-editable, iframe, textarea');
                            if (editorDoc) {
                                editorDoc.focus();
                                editorDoc.click();
                                setTimeout(function() {
                                    if (editorDoc.tagName === 'TEXTAREA') {
                                        editorDoc.value = e.data.formText.replace(/<br>/g, '\n');
                                    } else if (editorDoc.contentDocument) {
                                        editorDoc.contentDocument.body.innerHTML = e.data.formText;
                                    } else {
                                        editorDoc.innerHTML = e.data.formText;
                                    }
                                }, 200);
                            }
                        } catch(err) {}
                    }
                }, 1200);
            } else {
                alert('아트머그 팝업 객체를 찾을 수 없습니다.');
            }
        } catch(err) {
            alert('문의 팝업 실행 중 오류가 발생했습니다.');
        }
    }
}, false);

window.addEventListener('scroll', function() {
    var f = document.getElementById('portfolio-iframe');
    if (f) {
        var r = f.getBoundingClientRect();
        var o = r.top + window.pageYOffset;
        f.contentWindow.postMessage({type: 'scroll', scrollY: window.pageYOffset, offsetTop: o}, '*');
    }
});

var forceExpandInterval = setInterval(function() {
    try {
        var openBtn = document.querySelector('.btn_open_btn');
        var detailInfo = document.querySelector('.detailinfo');
        if (detailInfo && !detailInfo.classList.contains('showstep1')) {
            clearInterval(forceExpandInterval);
            return;
        }
        if (openBtn && !openBtn.classList.contains('hide')) {
            openBtn.click();
        }
        if (detailInfo) {
            detailInfo.classList.remove('showstep1');
        }
    } catch(err) {}
}, 200);
</script>
